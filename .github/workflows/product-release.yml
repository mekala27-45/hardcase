name: Evidence-gated product release
on:
  push:
    branches: [main]
    paths: [requests/publish.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: hardcase-product-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Check frozen evidence and wait for exact-commit verification
        run: python deploy/publish_product.py
