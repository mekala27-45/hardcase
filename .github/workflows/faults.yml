name: Independent PostgreSQL fault observations
on:
  push:
    branches: [main]
    paths: ['tests/postgres_faults.py', 'src/hardcase/registry/**', 'src/hardcase/api/receipts.py', 'db/**', '.github/workflows/faults.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ephemeral-test-only
          POSTGRES_DB: hardcase_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: src:.
      HARDCASE_TEST_DATABASE: '1'
      DATABASE_URL: postgresql://postgres:ephemeral-test-only@127.0.0.1:5432/hardcase_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - run: python -m pip install -r requirements-serve.txt
      - run: python tests/postgres_faults.py
      - name: Preserve observed outcomes
        if: always()
        run: |
          mkdir -p evidence/faults
          python -c "import json,os,pathlib; pathlib.Path('evidence/faults/terminal.json').write_text(json.dumps({'status':'${{ job.status }}','source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID']}))"
          git config user.name 'Ajay Mekala'
          git config user.email 'mekalaajayk@gmail.com'
          git switch -c results/faults-${{ github.run_id }}
          git add evidence/faults
          git commit -m 'evidence: preserve independently observed database fault cases'
          git push origin HEAD
