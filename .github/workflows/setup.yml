name: Setup probes
on:
  push:
    branches: [main]
    paths: [requests/setup.json, deploy/probe.py, requirements-train.txt, .github/workflows/setup.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hardcase-setup
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Install and execute actual probes
        shell: bash
        run: |
          set -euo pipefail
          trap 'python deploy/terminal.py "$?"' EXIT
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-train.txt
          python -m pip check
          python deploy/probe.py
      - name: Retain setup evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardcase-setup-${{ github.run_id }}
          path: artifacts/setup/
          retention-days: 14
          if-no-files-found: error
      - name: Publish small evidence for review
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/setup
          find artifacts/setup -maxdepth 1 -type f \( -name '*.json' -o -name '*.txt' \) -exec cp {} evidence/setup/ \;
          git config user.name 'Ajay Mekala'
          git config user.email 'mekalaajayk@gmail.com'
          git switch -c results/setup-${{ github.run_id }}
          git add evidence/setup
          git diff --cached --quiet || git commit -m 'evidence: retain actual setup probe and terminal state'
          git push origin HEAD
