name: Freeze observed float32 compatibility fallback
on:
  push:
    branches: [build/day27-evidence-completion]
    paths: ['requests/compatibility.json']
permissions:
  contents: write
jobs:
  fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - run: python -m pip install -r requirements-serve.txt
      - name: Verify original immutable export delivery
        run: |
          mkdir -p artifacts/downloads
          gh release download training-assets-42113390181 --pattern serving-bundles.tar.gz --pattern delivery.json --dir artifacts/downloads
          python -c "from hardcase.contracts import *; from deploy.package_runtime import safe_unpack; require(file_digest('artifacts/downloads/serving-bundles.tar.gz')==load_json('requests/compatibility.json')['original_asset_sha256'],'ORIGINAL_ASSET_CHANGED'); safe_unpack('artifacts/downloads/serving-bundles.tar.gz','.')"
      - name: Preserve original selection and verify unchanged float32 bundles
        run: python deploy/freeze_compatibility.py
      - name: Publish bounded compatibility artifact
        if: success()
        run: gh release create training-assets-${{ github.run_id }} artifacts/delivery/* --target ${{ github.sha }} --prerelease --title 'Hardcase float32 compatibility artifacts' --notes 'No retraining or held-out access. Original INT8 failure and export selection retained. Float32 model and vector bytes are unchanged; see the compatibility decision.'
      - name: Retain observed compatibility outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python -c "import os; from hardcase.contracts import atomic_json; atomic_json('evidence/compatibility/terminal.json',{'status':os.environ['JOB_STATUS'],'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':os.environ['GITHUB_SHA'],'test_access':False})"
          git config user.name 'Ajay Mekala'
          git config user.email 'mekalaajayk@gmail.com'
          git switch -c results/compatibility-${{ github.run_id }}
          git add evidence/compatibility
          git commit -m 'evidence: retain float32 compatibility fallback and original selection'
          git push origin HEAD
