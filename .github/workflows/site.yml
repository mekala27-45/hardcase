name: Workbench build and Pages
on:
  push:
    branches: [main]
    paths: ['site/**', 'evidence/**', 'deploy/build_site_data.py', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: hardcase-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.13'
      - run: python deploy/build_site_data.py
      - name: Resolve frontend lock
        working-directory: site
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
      - name: Validate responsive themes and evidence states
        working-directory: site
        run: |
          mkdir -p ../evidence/frontend
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Preserve resolved frontend inputs
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p evidence/frontend
          if [ -f site/package-lock.json ]; then cp site/package-lock.json evidence/frontend/package-lock.json; fi
          python -c "import json,os,pathlib; pathlib.Path('evidence/frontend/terminal.json').write_text(json.dumps({'status':os.environ['JOB_STATUS'],'run_id':os.environ['GITHUB_RUN_ID'],'source_commit':os.environ['GITHUB_SHA']}))"
          git config user.name 'Ajay Mekala'
          git config user.email 'mekalaajayk@gmail.com'
          git switch -c results/frontend-${{ github.run_id }}
          git add evidence/frontend
          git commit -m 'evidence: retain resolved frontend dependency graph'
          git push origin HEAD
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
