name: Review workbench without publishing
on:
  pull_request:
    paths: ['site/**', 'deploy/build_site_data.py', 'deploy/render_docs.py', 'evidence/**', '.github/workflows/review-site.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python deploy/decide_release.py
      - run: python deploy/render_docs.py
      - run: python deploy/build_site_data.py
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: python deploy/check_source.py
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npx playwright test
        working-directory: site
      - name: Print review observation records
        if: always()
        run: |
          python -c "import json, pathlib; paths=['evidence/frontend/browser-checks.json','evidence/frontend/scripted-controls.json','evidence/verification/source-scan.json','evidence/release/decision.json']; print('HARDCASE_REVIEW_RECORDS='+json.dumps({p:json.loads(pathlib.Path(p).read_text()) for p in paths if pathlib.Path(p).exists()}))"
      - name: Print generated source-bound documents
        run: |
          python -c "import json,pathlib; paths=['README.md','RESULTS.md','evidence/claims/preparation.json']+[str(p) for p in pathlib.Path('model-cards').glob('*.md')]; print('HARDCASE_GENERATED_DOCS='+json.dumps({p:pathlib.Path(p).read_text() for p in paths}))"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: review-interface-observations
          path: |
            evidence/frontend/
            site/test-results/
          retention-days: 7
