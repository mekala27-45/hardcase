name: Frozen held-out retrieval study
on:
  push:
    branches: [main]
    paths: [requests/evaluate.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: src:.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Require frozen study and pretest live evidence
        run: |
          python -c "from hardcase.contracts import *; r=load_json('requests/evaluate.json'); p=load_json('evidence/live/pretest.json'); require(p['status']=='verified' and digest(p)==r['pretest_live_digest'],'PRETEST_LIVE_EVIDENCE_MISSING')"
      - name: Restore fixed data and model assets
        run: python deploy/restore_evaluation.py
      - name: Install frozen evaluation environment
        run: |
          python -m pip install -r requirements-resolved.txt -r requirements-serve-resolved.txt httpx==0.28.1 --extra-index-url https://download.pytorch.org/whl/cpu
          python -m pip check
          python -m unittest discover -s tests -v
      - name: Execute unchanged full-corpus methods and independent grading
        run: python -m evaluation.run
      - name: Preserve all attempted and missing rows
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          mkdir -p evidence/evaluation
          cp artifacts/evaluation/*/*.json evidence/evaluation/ 2>/dev/null || true
          python -c "import os; from hardcase.contracts import atomic_json; atomic_json('evidence/evaluation/terminal.json',{'status':os.environ['JOB_STATUS'],'source_commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID']})"
          python deploy/publish_json_evidence.py evaluation evidence/evaluation
