name: Observe frozen bundle startup across CPU runners
on:
  push:
    branches: [build/day27-evidence-completion]
    paths: ['requests/startup-matrix.json']
permissions:
  contents: write
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3]
    env:
      PYTHONPATH: src:.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - run: python -m pip install -r requirements-serve.txt
      - name: Fetch unchanged bounded bundle archive
        run: |
          mkdir -p artifacts/downloads
          gh release download training-assets-42113390181 --pattern serving-bundles.tar.gz --dir artifacts/downloads
          python -c "from hardcase.contracts import *; from deploy.package_runtime import safe_unpack; require(file_digest('artifacts/downloads/serving-bundles.tar.gz')==load_json('requests/startup-matrix.json')['asset_sha256'],'DIAGNOSTIC_ASSET_CHANGED'); safe_unpack('artifacts/downloads/serving-bundles.tar.gz','.')"
      - run: python deploy/diagnose_startup.py
      - name: Retain every observed startup outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python -c "import os; from hardcase.contracts import atomic_json; atomic_json('evidence/runtime/diagnostic-terminal.json',{'status':os.environ['JOB_STATUS'],'run_id':os.environ['GITHUB_RUN_ID'],'trial':${{ matrix.trial }},'source_commit':os.environ['GITHUB_SHA']})"
          git config user.name 'Ajay Mekala'
          git config user.email 'mekalaajayk@gmail.com'
          git switch -c results/startup-${{ github.run_id }}-${{ matrix.trial }}
          git add evidence/runtime/startup-diagnostic.json evidence/runtime/diagnostic-terminal.json
          git commit -m 'evidence: record unchanged bundle startup on independent CPU runner'
          git push origin HEAD
