[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hardcase"
version = "0.1.0"
description = "Evidence-bound retrieval training and serving"
requires-python = ">=3.12,<3.13"
dependencies = [
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.16.0",
  "click==8.5.0",
  "fastapi==0.162.0",
  "filelock==4.2.4",
  "flatbuffers==25.12.19",
  "fsspec==2026.9.0",
  "h11==0.16.0",
  "hf-xet==1.8.0",
  "httpcore2==2.16.0",
  "httpx2==2.16.0",
  "huggingface-hub==2.4.0",
  "idna==3.20",
  "numpy==2.5.4",
  "onnxruntime==1.31.1",
  "opentelemetry-api==1.45.2",
  "packaging==26.3",
  "protobuf==7.36.2",
  "psycopg-binary==3.3.8",
  "psycopg==3.3.8",
  "pydantic-core==2.50.4",
  "pydantic==2.14.3",
  "pyyaml==6.0.3",
  "starlette==1.10.0",
  "tokenizers==0.23.3",
  "tqdm==4.70.1",
  "truststore==0.10.5",
  "typing-extensions==4.16.0",
  "typing-inspection==0.4.5",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
serve = ["numpy==2.5.4", "onnxruntime==1.31.1", "tokenizers==0.23.3", "fastapi==0.162.0", "uvicorn==0.54.0", "psycopg[binary]==3.3.8", "pydantic==2.14.3"]
train = ["torch==2.15.0", "transformers==5.22.1", "sentence-transformers==6.2.0", "safetensors==0.8.0", "huggingface-hub==2.4.0", "numpy==2.5.4", "scipy==1.18.1"]
export = ["onnx==1.23.2", "onnxscript==0.7.2", "onnxruntime==1.31.1"]
test = ["pytest==9.2.0", "httpx==0.28.1", "psutil==7.2.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/hardcase"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
